services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: provisioning_orchestrator
    restart: unless-stopped
    environment:
      - PORT3000
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      # Persistent SQLite Database & Local storage
      - orchestrator_data:/app/deploy_app/open_webui/app/data
      # Mount compiled React Frontend from host (Instant updates without rebuilding Docker image)
      - ./deploy_app/open_webui/frontend/dist:/app/deploy_app/open_webui/frontend/dist:ro
      # Mount standalone HTML templates
      - ./deploy_app/open_webui/request_form.html:/app/deploy_app/open_webui/request_form.html:ro
      - ./deploy_app/open_webui/email_approval_template.html:/app/deploy_app/open_webui/email_approval_template.html:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - provisioning_net
      - proxy-net

  redis:
    image: redis:7-alpine
    container_name: provisioning_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - provisioning_net

volumes:
  orchestrator_data:
    name: provisioning_orchestrator_data
  redis_data:
    name: provisioning_redis_data

networks:
  provisioning_net:
    name: provisioning_network
    driver: bridge
  proxy-net:
    external: true
