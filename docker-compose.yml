services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: provisioning_orchestrator
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - SERVICE_FQDN_ORCHESTRATOR_8000
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      # Persistent SQLite Database & Local storage
      - orchestrator_data:/app/deploy_app/open_webui/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - provisioning_net
      - coolify

  redis:
    image: redis:7-alpine
    container_name: provisioning_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - provisioning_net

volumes:
  orchestrator_data:
    name: provisioning_orchestrator_data
  redis_data:
    name: provisioning_redis_data

networks:
  provisioning_net:
    name: provisioning_network
    driver: bridge
  coolify:
    external: true
